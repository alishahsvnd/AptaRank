name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip cython setuptools wheel

      # ushuffle's sdist ships pre-generated Cython C that references tp_print,
      # removed in CPython 3.9. setup.py re-cythonizes when Cython is importable,
      # which build isolation prevents — hence --no-build-isolation.
      - name: Build ushuffle from source
        shell: bash
        run: |
          python -m pip download ushuffle --no-binary :all: --no-deps -d ushuffle_src
          tar -xzf ushuffle_src/ushuffle-*.tar.gz -C ushuffle_src
          python -m pip install --no-build-isolation ushuffle_src/ushuffle-*/

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the headless pipeline
        shell: bash
        run: |
          python scripts/make_dev_data.py
          python -m aptarank run data/demo_candidates.csv \
            --development-corpus data/corpus/dev_placeholder_corpus.csv \
            --set tier1.shuffle.n_shuffles=5 \
            --set tier1.n_ensemble_samples=20 \
            --set output.n_diagrams=2
          python -m aptarank artifact summary runs/*.json
