# AptaRank default configuration.
#
# Every tunable in the pipeline lives here. Nothing in this file may be
# hard-coded in the source (spec §9). The fully resolved config is copied
# verbatim into every run artifact, so a run is always reproducible from
# the artifact alone.

run:
  # standard | fast   (fast skips shuffled controls and ensemble sampling)
  mode: standard
  seed: 42

input:
  min_length: 20
  max_length: 100

corpus:
  # Path to the validated-aptamer reference corpus CSV
  # (columns: id, sequence, target_name, target_pdb_id, source_reference).
  # Tier 1 percentile scoring is blocked without it (spec §3.5.1).
  path: null
  # Declares that corpus.path is synthetic development data rather than real
  # validated aptamers. Set automatically by `--development-corpus`.
  is_placeholder: false
  # Refuse to score against a synthetic/placeholder corpus unless explicitly
  # enabled. Placeholder runs are stamped publication_eligible: false.
  allow_placeholder: false
  cache_dir: cache/corpus

tier1:
  n_ensemble_samples: 100

  # Weights over the five scoring criteria. Equal by default and NEVER fitted
  # to the evaluation groups (spec §8.4).
  weights:
    mfe_norm: 1.0
    ensemble_defect: 1.0
    positional_entropy_mean: 1.0
    stem_fraction: 1.0
    gc_fraction: 1.0

  composite:
    # corpus_weighted_mean : tier1_score is an absolute, corpus-calibrated
    #                        score, comparable across runs and batches.
    #                        Required for evaluation E1 to be meaningful.
    # batch_rank_aggregation : literal reading of the spec §4.9 snippet;
    #                        scores depend on what else was submitted.
    method: corpus_weighted_mean

  shuffle:
    enabled: true
    n_shuffles: 20              # 99 for publication runs
    k: 2                        # dinucleotide-preserving
    alpha: 0.05                 # Monte-Carlo p-value threshold for shuffle_pass
    # Criteria used for the structural sub-score compared against shuffles.
    # gc_fraction and length are excluded: dinucleotide shuffling preserves
    # them exactly, so they contribute a constant to every shuffle.
    structural_criteria:
      - mfe_norm
      - ensemble_defect
      - positional_entropy_mean
      - stem_fraction

  parallel:
    workers: null               # null -> cpu_count() - 1
    chunk_size: 16

tier2:
  enabled: false                # flipped on once a target is configured
  n_candidates: 1000

  # Which geometry is compared. The tool does NOT infer this: the expert asserts
  # how they believe the aptamer engages the target, and the comparison adapts.
  #
  #   pocket  : a flexible loop / unpaired region engages a concave cavity
  #   surface : the molecule covers a flat-ish surface patch (shape + charge)
  #   groove  : a helical stem lies along an elongated channel — FUTURE WORK,
  #             described in the paper, deliberately not implemented
  binding_mode: pocket

  # Physical constants. Coarse by design; each states what it assumes, and
  # none is ever fitted to the evaluation groups.
  geometry:
    a_per_nt_ss: 6.0            # extended single-stranded rise per nucleotide, A
    a_per_bp_helix: 2.8         # A-form helix rise per base pair, A (groove, future)
    # Surface-mode footprint: each nucleotide is assumed to cover a square of
    # side (a_per_nt_ss * footprint_scale), so 1.0 means ~36 A^2 of contact per
    # nucleotide. An over-estimate for compactly folded candidates — only part
    # of a folded molecule can touch a surface at once.
    footprint_scale: 1.0

  # -- pocket mode (Mode A) ------------------------------------------------
  flex_c: 1.0
  sigma_A: 6.0
  # flexible : sqrt-scaling end-to-end proxy (primary; contour length badly
  #            over-penalises long loops)
  # extended : contour length, reported as an upper-bound sensitivity check
  primary_descriptor: flexible

  # -- surface mode (Mode C) -----------------------------------------------
  surface:
    # How big a face the candidate presents to the patch.
    #
    # radius_of_gyration : size of the folded molecule, from the secondary
    #                      structure's element graph. Distinguishes an extended
    #                      helix from a compact junction of the same length.
    # length             : the cheap proxy — area grows linearly with
    #                      nucleotide count, so two candidates of equal length
    #                      are identical whatever they fold into. Kept for
    #                      comparison and for reproducing earlier runs.
    footprint_model: radius_of_gyration
    # Gaussian width on the footprint/patch area mismatch, A^2. Display only:
    # bands come from the control percentile, never from this number.
    sigma_A2: 600.0
    # Whose solvent-accessible area the patch is. `selected_residues` is the
    # whole configured binding-site residue set; the alternative (the subset
    # lining a detected pocket) is recorded in the bundle but not yet default.
    patch_area_definition: selected_residues
    # RNA is uniformly negative, so a positive patch is hospitable. This is a
    # TARGET-level property: identical for every candidate, therefore it can
    # shift the score but can never move one candidate past another or change
    # a band. Documented in the artifact and the UI.
    charge:
      enabled: true
      # Sets how quickly the complementarity factor saturates: f = 1/(1+exp(-phi/scale)).
      # 5 kT/e is the rough spread of protein surface potentials, so the factor
      # stays informative across targets instead of pinning to 0 or 1 on the
      # first mildly charged patch. Never fitted to a result.
      scale_kT_per_e: 5.0
    weights:
      size_coverage: 1.0
      charge_complementarity: 1.0

  band_percentiles:
    moderate: 0.75
    strong: 0.95

  # Bands are defined against a FIXED bank of corpus-derived shuffled controls,
  # not against the shuffles of whatever batch was submitted (see
  # tier2/calibration.py). Target-independent, so it is folded once and reused.
  calibration:
    bank_size: 5000             # 2000 is adequate for development runs
    cache_dir: cache/calibration

  target:
    name: null                  # what the biologist calls it, e.g. IGFBP3
    source: pdb                 # pdb | alphafold
    id: null                    # PDB ID for source=pdb; UniProt ID for alphafold
    chain: null                 # null -> first protein chain (alphafold is always A)
    # Chains of the binding partner in a complex. They are used to locate the
    # site while the complex is still loaded, and are then stripped so the
    # surface they covered is exposed for measurement (§3.4).
    partner_chains: []
    # Literature-confirmed binding-site residue numbers, in the AUTHOR numbering
    # of `chain` — plain integers, not K42. Empty falls back to automatic
    # pocket selection, which the artifact records so the UI can caveat it.
    target_site_residues: []
    model: 0
    # Waters always go. Other hetero groups are retained by default because for
    # enzyme targets they include the functional metal that shapes the cavity.
    strip_hetatm: false
    hetero_default: retain      # retain | remove
    retain_hetero_resnames: []  # e.g. [ZN] — kept because they shape the cavity
    remove_hetero_resnames: [HOH, DOD, WAT]
    # Zero overlap between the residue list and every pocket fails the build by
    # default: it almost always means a numbering or chain mismatch.
    allow_zero_overlap_fallback: false

  electrostatics:
    enabled: false              # stretch goal; target-level only, never in the score

  bundle_dir: cache/targets
  bundle_path: null             # explicit bundle file; overrides bundle_dir lookup
  structure_cache_dir: cache/structures

output:
  dir: runs
  n_diagrams: 50
  embed_svg: true               # inline SVG text in the artifact (self-contained)
